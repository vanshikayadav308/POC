openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HEGP - AI Educational Video Generator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Video generation jobs
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all video generation jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a specific job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{id}/logs:
    get:
      operationId: getJobLogs
      tags: [jobs]
      summary: Get logs for a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /recent-jobs:
    get:
      operationId: getRecentJobs
      tags: [jobs]
      summary: Get recently completed jobs
      responses:
        "200":
          description: Recent completed jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Job:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
        filename:
          type: ["string", "null"]
        classNumber:
          type: ["string", "null"]
        language:
          type: ["string", "null"]
        voiceBackend:
          type: ["string", "null"]
        transitionStyle:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        progress:
          type: ["integer", "null"]
        currentStage:
          type: ["string", "null"]
        screenplay:
          type: ["string", "null"]
        videoPath:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        sceneCount:
          type: ["integer", "null"]
        durationSeconds:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]

    JobLog:
      type: object
      required: [id, jobId, message, createdAt]
      properties:
        id:
          type: integer
        jobId:
          type: string
        stage:
          type: ["string", "null"]
        message:
          type: string
        createdAt:
          type: string

    Stats:
      type: object
      required: [totalJobs, completedJobs, failedJobs, processingJobs, avgDurationSeconds]
      properties:
        totalJobs:
          type: integer
        completedJobs:
          type: integer
        failedJobs:
          type: integer
        processingJobs:
          type: integer
        avgDurationSeconds:
          type: ["number", "null"]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
